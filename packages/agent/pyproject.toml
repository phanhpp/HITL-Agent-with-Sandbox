[project]
name = "agent"
version = "0.1.0"
description = "LangGraph agents served by langgraph-api."
requires-python = ">=3.11"

# Runtime deps only — these are what the deployed image installs.
dependencies = [
    "langchain",
    "langgraph",
    "langchain-anthropic",
    "deepagents>=0.7.21",
    # Arrives transitively with langchain anyway, but agents/run_ids.py and
    # routes/feedback.py import it directly — the run tree, and create_feedback.
    "langsmith",
    # The deployed image gets starlette via langgraph-api, but routes/ imports it
    # directly, and a runtime dep that is only present because the SERVER happens to
    # pull it in is one upgrade away from vanishing. `uv sync --no-dev` proved the gap.
    "starlette",
]

# Local-only. The deployed image already ships langgraph-api, and the CLI is a
# development tool, so neither belongs in the runtime set above.
[dependency-groups]
dev = [
    "langgraph-cli[inmem]",
    "langgraph-api>=0.9.0",
]
# Deliberately its own group, not part of `dev`: CI's import check runs --no-dev to
# prove the DEPLOYED set is complete, and the tests must not be able to satisfy an
# import the deployed image would be missing.
test = [
    "pytest",
    "pytest-asyncio",
]

# uv mode requires an installable package -- `tool.uv.package = false` is rejected
# with "so it cannot be deployed". `agents/` and `tools/` each got an __init__.py so
# setuptools can find them; `from tools.email import ...` keeps working either way.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Explicit, not auto-discovery. A new top-level package must be added here or it
# is simply absent from the deployed image, and the failure shows up mid-deploy.
packages = ["agents", "tools", "routes"]

# `asyncio_mode = "auto"` so an `async def test_` needs no decorator. The routes are
# async, so most tests here are.
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# `langgraph.json` puts the package root on the path for the server; pytest does not,
# so `import http_app` / `import routes...` would fail without this.
pythonpath = ["."]
