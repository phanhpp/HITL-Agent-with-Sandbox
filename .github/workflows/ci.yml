# The gate that `main` auto-deploying to production makes necessary.
#
# Both halves of this repo deploy on push — Vercel builds packages/web, LangSmith
# builds packages/agent — so without this, a type error or a bad import is found by
# the deploy rather than before it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Typecheck and test the web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/web
    steps:
      - uses: actions/checkout@v4

      # pnpm before setup-node: `cache: pnpm` needs the binary to already exist.
      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          # Paths in `uses` steps are repo-relative — `defaults.working-directory`
          # only applies to `run`.
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: packages/web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # The script runs `next typegen` before `tsc`. It has to: `RouteContext` and the
      # route-literal types are generated into .next/types/, which is gitignored, so a
      # bare `tsc --noEmit` on a fresh checkout fails on types that exist on your laptop.
      - run: pnpm run typecheck

      # Hooks only — no browser, no agent server, no API key.
      - run: pnpm run test

      # Browser tests. Also no agent and no key: every agent call is intercepted and
      # answered from fixtures recorded off the real server, so the run is deterministic.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:e2e

  agent:
    name: Import the graphs and test the agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/agent
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # --no-dev installs exactly what the deployed image installs, so a dependency
      # that only works because langgraph-cli happens to pull it in fails here.
      # --frozen fails rather than silently re-resolving uv.lock.
      - run: uv sync --no-dev --frozen

      # Importing is the whole check: it catches syntax errors, missing dependencies
      # and bad imports — the failures that otherwise surface mid-deploy. No API key
      # is needed, because the models are built inside the graph factory, not at
      # import time.
      # http_app too: langgraph.json mounts it, but importing only the graphs would let a
      # broken route module — or one missing from [tool.setuptools] packages — ship.
      - run: uv run --no-dev python -c "import agents.human_in_the_loop, agents.orchestrator, http_app"

      # Separate sync: the import check above must stay --no-dev so it proves the
      # DEPLOYED dependency set is complete. pytest lives in its own group for the same
      # reason — a test dependency must never be able to satisfy a runtime import.
      - run: uv sync --group test --frozen
      - run: uv run --group test pytest -q
